name: Capability request
description: Propose a concrete improvement to evidence checking or review usability.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Research workflow and missing capability
      description: Describe one task that is difficult or impossible with the current version.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example and acceptance evidence
      description: Use synthetic or clearly licensed material. Explain an observable result that would demonstrate the improvement.
    validations:
      required: true
